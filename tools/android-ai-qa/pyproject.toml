[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "android-ai-qa"
version = "0.1.0"
description = "Local DeepSeek agent using the official Maestro MCP"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx>=0.28,<1", "pydantic>=2.10,<3", "typer>=0.16,<1", "PyYAML>=6,<7", "Pillow>=11,<13", "python-dotenv>=1,<2", "pathspec>=0.12,<2", "tzdata>=2025"]

[project.scripts]
android-qa = "android_qa.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: actual device, Maestro and paid DeepSeek calls"]
addopts = "-m 'not live'"
